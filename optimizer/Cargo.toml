[package]
name = "stellac-optimizer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regress = "0.12.0"
bitvector = "0.1.5"
slotmap = "1.1.1"
anyhow = "1.0.104"

[dev-dependencies]
insta = { version = "1.46.3", features = ["glob"] }
serde_yaml = "0.9.27"
tempfile = "3.8.1"
pathdiff = "0.2"

[build-dependencies]
prettyplease = "0.3"
schemars = "0.8"
serde_json = "1.0"
syn = "3.0"
typify = "0.10.1"
